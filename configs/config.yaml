server:
  port: "8888"
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 60

database:
  host: "localhost"
  port: 3306
  username: "root"
  password: "password"
  database: "douyin"
  max_open_conns: 100
  max_idle_conns: 10
  log_level: "error"

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5

kafka:
  brokers:
    - "localhost:9092"
  topic_prefix: "douyin"
  group_id: "douyin-group"
  require_acks: "WaitForAll"
  partitioner: "NewRandomPartitioner"

oss:
  endpoint: "https://oss-cn-hangzhou.aliyuncs.com"
  access_key_id: ""
  access_key_secret: ""
  bucket: "douyin-videos"
  bucket_directory: "videos"

jwt:
  secret: "your-super-secret-jwt-key-change-in-production"
  expire_time: 24
  refresh_time: 168

log:
  level: "info"
  format: "json"
  output: "stdout"
  file_path: "./logs/app.log"
  max_size: 100
  max_backups: 3
  max_age: 28

rpc:
  services:
    user:
      host: "localhost"
      port: 50051
    video:
      host: "localhost"
      port: 50052
    favorite:
      host: "localhost"
      port: 50053
    comment:
      host: "localhost"
      port: 50054
    follow:
      host: "localhost"
      port: 50055
    message:
      host: "localhost"
      port: 50056

security:
  password_encrypted: true
  bcrypt_cost: 12
  allowed_origins: "*"
  rate_limit: 1000 